name: Verify numerical companion
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-boundary:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_companion.py --boundary-only
  python-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r requirements-unit01.txt
      - run: make PYTHON=python verify
        env:
          PYTHONUNBUFFERED: '1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
  r-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-unit01.txt
      - run: sudo apt-get update && sudo apt-get install -y r-base-core
      - run: make PYTHON=python r-audit
        env:
          PYTHONUNBUFFERED: '1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - run: python -m pip install -r requirements-unit01.txt
      - run: python scripts/verify_companion.py --boundary-only
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_local_stages.py --stage verify
      - run: python scripts/run_local_stages.py --stage base-r
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - run: python -m pip install -r requirements-unit01.txt
      - run: make PYTHON=python verify
      - run: make PYTHON=python r-audit
